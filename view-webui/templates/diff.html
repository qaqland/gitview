{% if lines.is_empty() %}
<p class="muted">No changes for this path at this revision.</p>
{% else %}
<div class="diff" tabindex="0" role="region" aria-label="Diff">{% for line in lines %}<div class="diff-line{% if !line.class.is_empty() %} {{ line.class }}{% endif %}">{{ line.text }}</div>{% endfor %}</div>
{% endif %}
