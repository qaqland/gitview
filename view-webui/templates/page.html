<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/view.css">
  {% if alternate_markdown_href.len() > 0 %}<link rel="alternate" type="text/markdown" href="{{ alternate_markdown_href }}">{% endif %}
  {% if alternate_text_href.len() > 0 %}<link rel="alternate" type="text/plain" href="{{ alternate_text_href }}">{% endif %}
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
{{ header_html|safe }}
  <main id="content">
{{ content_html|safe }}
  </main>
  <footer>{% if generated.is_empty() %}GitView {{ version }}{% else %}Generated in about {{ generated }}s by GitView {{ version }}{% endif %}</footer>
</body>
</html>
