[package]
name = "view-webui"
version = "0.0.1"
edition = "2024"

# Short internal name: the crate is never published, the binary name stays view-webui.
[lib]
name = "app"

[dependencies]
ammonia = "4"
anyhow = "1"
askama = "0.12"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
deadpool-sqlite = "0.10"
git2 = "0.20"
html-escape = "0.2"
moka = { version = "0.12", features = ["future"] }
percent-encoding = "2"
url = "2"
rusqlite = "0.33"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
comrak = { version = "0.56", default-features = false, features = ["syntect"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
